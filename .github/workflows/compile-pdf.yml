name: LaTeX Compile PDF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:


jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup TeX Live
      uses: EasonSYC/latex-style-setup@main

    - name: Compile PDF
      uses: EasonSYC/latex-compile-pdf@main
      with:
        job-name: ${{ github.event.repository.name }}
        version: false